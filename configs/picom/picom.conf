backend = "glx";
vsync = true;
glx-use-copysubbuffer-mesa = true;

glx-copy-from-front = true;
glx-swap-method = 2;
xrender-sync = true;
xrender-sync-fence = true;


# Sombras
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -7;
shadow-offset-y = -7;

# Transparencia
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;

# Desvanecimientos
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 10;

# Transiciones suaves
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 10;
